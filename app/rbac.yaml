apiVersion: v1
kind: ServiceAccount
metadata:
  name: hook-checker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hook-checker
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hook-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hook-checker
subjects:
  - kind: ServiceAccount
    name: hook-checker
